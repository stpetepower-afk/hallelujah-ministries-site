<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Hallelujah Ministries</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/main.css">
<style>
  .error-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;background:#2D3142;}
  .error-code{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(80px,18vw,180px);line-height:1;color:rgba(242,193,78,0.18);margin-bottom:0;}
  .error-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(28px,5vw,48px);color:#FAF4E8;margin:-16px 0 20px;}
  .error-desc{font-size:17px;line-height:1.7;color:rgba(250,244,232,0.65);max-width:480px;margin:0 auto 40px;}
  .error-links{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;}
</style>
</head>
<body>
<div class="error-wrap">
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-desc">The page you're looking for doesn't exist or may have moved. Let us help you find what you need.</p>
  <div class="error-links">
    <a href="/" class="btn-solid">Go Home</a>
    <a href="/#contact" class="btn-outline">Get Help</a>
  </div>
</div>
</body>
</html>
