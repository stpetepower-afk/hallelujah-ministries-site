<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stewardship | Hallelujah Ministries Florida</title>
    <meta name="description" content="Financial stewardship, donor transparency, and impact reporting for Hallelujah Ministries Florida partners and supporters.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C9A227; --gold-light: #E8D5A3; --navy: #0A1628; --navy-light: #1A2B47; --white: #FFFFFF; --gray: #6B7280; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--navy); color: var(--white); line-height: 1.6; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 22, 40, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201, 162, 39, 0.15); }
        .logo { font-weight: 800; font-size: 1.25rem; color: var(--gold); text-decoration: none; }
        .logo span { color: var(--white); font-weight: 500; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.3s; }
        .nav-links a:hover { color: var(--gold); }
        .hero { min-height: 45vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8rem 2rem 4rem; background: radial-gradient(ellipse at 20% 50%, rgba(201, 162, 39, 0.06) 0%, transparent 50%), var(--navy); }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; margin-bottom: 1rem; }
        .hero h1 .highlight { color: var(--gold); }
        .hero p { color: rgba(255,255,255,0.7); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
        section { padding: 4rem 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
        .section-header p { color: var(--gray); }
        .card { background: rgba(10, 22, 40, 0.5); border: 1px solid rgba(201, 162, 39, 0.1); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        .card h3 { color: var(--gold); font-size: 1.1rem; margin-bottom: 0.5rem; }
        .card p { color: rgba(255,255,255,0.7); font-size: 0.95rem; }
        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .metric { text-align: center; padding: 1.5rem; background: rgba(201, 162, 39, 0.06); border-radius: 12px; border: 1px solid rgba(201, 162, 39, 0.1); }
        .metric-value { font-size: 2.2rem; font-weight: 800; color: var(--gold); }
        .metric-label { color: rgba(255,255,255,0.5); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }
        footer { background: var(--navy); border-top: 1px solid rgba(255,255,255,0.06); padding: 3rem 2rem; text-align: center; }
        .footer-logo { font-weight: 800; font-size: 1.1rem; color: var(--gold); margin-bottom: 1rem; }
